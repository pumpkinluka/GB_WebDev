<!DOCTYPE html> 
<html lang="en">
    <head>
        <title>HTML Advanced Notes</title>
        <meta charset="UTF-8">
        <style>
            /* Cascading Style Sheets 
            1. Selector -> says what to change
            2. Declaration
                a. Property -> what about the element to change
                b. Value -> How to change it
            */
            body{
                color:rgb(148, 27, 83);
                background-color:rgb(255, 227, 240);
                border: solid 3px #ffffff;
            }
            h1{
                text-align: center;
            }
            #even{
                color:rgb(59, 42, 29);
                text-decoration:underline;
            }
            .lists{
                width: 50%;
                background-color:rgb(212, 255, 225);
                border-radius: 5px;
                font-size: 1rem;
            }
        </style>
    </head>
    <body>
        <h1>HTML Advanced Notes</h1>
        <div class="lists">
        <h3>Lists:</h3>
        <ol type="I">
            <li id="even">Chiikawa</li>
            <li>Hachiware</li>

        </ol>
        <ul>

            <li>pomengranate</li>
            <li>cats</li>
        </ul>
        <dl>
            <dt>Autumn</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>New Years Eve</dd>
        </dl>
        </div>

</html>

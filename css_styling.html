<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Styling with Color</title>
        <meta charset="UTF-8">
        <style>
            body{
                background-color:black;
            }
            h2{
                color:white;
            }
            .comp{
                width: 300px;
                height: 300px;
                background-color:purple;
                border: solid 10px yellow
            }
             .analog{
                width: 300px;
                height: 300px;
                background-color:blueviolet;
                border: solid 10px blue
            }
             .tri{
                width: 300px;
                height: 300px;
                background-color:blue;
                border: solid 10px red
            }
            #ugh{
                color:violet
            }
            #yellow{
                color:yellow
            }
        </style>
    </head>
    <body>
        <div class="comp">
        <h2><b>Complementary</b></h2>
        </div>

        <div class="analog">
        <h2 id="ugh"><b>Analogous</b></h2>
        </div>

        <div class="tri">
        <h2 id="yellow"><b>Triadic</b></h2>
        </div>
    </body>
</html>

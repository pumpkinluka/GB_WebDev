<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Styling with Color</title>
        <meta charset="UTF-8">
        <style>
            body{
                background-color:black;
            }
            h2{
                color:white;
            }
        </style>
    </head>
    <body>
        <div>
        <h2><b>Complementary</b></h2>
        </div>

        <div>
        <h2><b>Analogous</b></h2>
        </div>

        <div>
        <h2><b>Triadic</b></h2>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment Notes</title>
        <meta charset="UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color:azure;
                color: black;
                text-align: center;
            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 1fr 1fr 100px;
                gap: 5px;
            }
            button{
                margin-top: 25px;
                padding: 25px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
            }
            img{
                width: 200px;
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="cute cat picture.webp" alt="fat cat" id="fatahhcat" onmouseout="rotate()">
        <div id="flex-wrapper">
            <div id="box" onmouseover="showHide()">
                <p id="text">Show More</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="newColor">
        <br>
        <botton onclick="changeColor()">Click Me!</botton>

        <script>
            let images = ["classic lolita.jpg", "Gothic_lolita_dress.jpg", "Sweet_Lolita_Fashion.jpg", "cute cat picture.webp"]
            let currentImage = 0
            function rotate(){
                currentImage += 1
                 if (currentImage > 3){
                    currentImage = 0
                 }
                document.getElementById("fatahhcat").src = images[curentImage]
            }
            function changeColor(){
                let currentColor = document.getElementById("newColor").value
                document.getElementById("box").
                style.backgroundColor ="orange"
            }
            function showHide(){
                let item = document.getElementById("flex-wrapper")
                if(item.style.display == "flex"){
                    item.style.display="none"
                    document.getElementById("text").innerHTML = "Show More"
                }else{
                    item.style.display="flex"
                    document.getElementById("text").innerHTML = "Show Less"
                }
            }
        </script>
    </body>
</html>
